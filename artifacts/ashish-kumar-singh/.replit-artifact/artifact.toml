kind = "web"
previewPath = "/"
title = "Ashish Kumar Singh — Official Website"
version = "1.0.0"
id = "artifacts/ashish-kumar-singh"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21965

[services.development]
run = "pnpm --filter @workspace/ashish-kumar-singh run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ashish-kumar-singh", "run", "build" ]
serve = "static"
publicDir = "artifacts/ashish-kumar-singh/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21965"
BASE_PATH = "/"
